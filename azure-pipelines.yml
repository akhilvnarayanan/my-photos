trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  name: MyPhotos-WSL

steps:
  - checkout: self

  - task: NodeTool@0
    inputs:
      versionSpec: '24.x'

  - script: |
      corepack enable
      corepack prepare pnpm@11.25.0 --activate
      pnpm install --frozen-lockfile
    displayName: Install dependencies

  - script: |
      pnpm -r build
    displayName: Build application