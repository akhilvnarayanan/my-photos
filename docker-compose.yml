services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d my_photos"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      PHOTO_STORAGE_PATH: /photos
      MY_PHOTOS_USERNAME: ${MY_PHOTOS_USERNAME:?Set MY_PHOTOS_USERNAME in .env}
      MY_PHOTOS_PASSWORD: ${MY_PHOTOS_PASSWORD:?Set MY_PHOTOS_PASSWORD in .env}
      PORT: 8080
      IMPORT_CONCURRENCY: ${IMPORT_CONCURRENCY:-2}
    volumes:
      - ${PHOTO_STORAGE_HOST_PATH:?Set PHOTO_STORAGE_HOST_PATH in .env}:/photos
      - ${PHOTO_IMPORT_HOST_PATH:?Set PHOTO_IMPORT_HOST_PATH in .env}:/imports:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
